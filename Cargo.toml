[package]
name = "tsw"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow             = "1.0"
clap               = { version = "4.5", features = ["derive"] }
tokio              = { version = "1.0", features = ["signal", "rt-multi-thread", "macros", "process", "io-util"] }
tracing            = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
nix = { version = "0.29", features = ["signal"] }
