[package]
name = "tsw"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
signal-hook = { version = "0.3", features = ["iterator"] }

[dev-dependencies]
nix = { version = "0.29", features = ["signal"] }
